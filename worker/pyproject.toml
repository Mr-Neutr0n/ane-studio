[project]
name = "ane-studio-worker"
version = "0.1.0"
description = "Local Hugging Face conversion and Core ML runtime worker for ANE Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub==1.29.0",
]

[project.optional-dependencies]
coreml = [
    "accelerate==1.14.0",
    "coremltools==9.0",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "torch==2.7.0",
    "transformers==5.16.1",
]
test = [
    "pytest==9.0.2",
    "ruff==0.16.5",
]

[project.scripts]
ane-studio-worker = "ane_studio_worker.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ane_studio_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
