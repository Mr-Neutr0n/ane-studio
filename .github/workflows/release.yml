name: Build unsigned macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      # Listing draft releases needs write access. This job installs no dependencies.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the matching version tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF!==`refs/tags/v${p.version}`) throw new Error("Select the existing tag that matches package.json");'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Refuse to rebuild an existing release or draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-release-draft.ts --check

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.17
          enable-cache: true
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd website --frozen-lockfile
          cd website && bunx playwright install chromium webkit
      - name: Verify and build the self-contained app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run verify
          bun run release:local
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            artifacts/packaged-startup.png
            artifacts/runtime/runtime-manifest.json
            artifacts/runtime-notices/
          retention-days: 30
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archive
          path: |
            dist/ANE-Studio-*-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      # Only this job, which runs no build or dependency scripts, can write releases.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Download the verified archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archive
          path: dist
      - name: Check the archive digest
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-release-draft.ts
