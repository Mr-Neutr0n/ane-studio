name: Build unsigned macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the matching version tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF!==`refs/tags/v${p.version}`) throw new Error("Select the existing tag that matches package.json");'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.17
          enable-cache: true
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd website --frozen-lockfile
          cd website && bunx playwright install chromium webkit
      - name: Verify and build the self-contained app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run verify
          bun run release:local
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            artifacts/packaged-startup.png
            artifacts/runtime/runtime-manifest.json
            artifacts/runtime-notices/
          retention-days: 30
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-release-draft.ts
